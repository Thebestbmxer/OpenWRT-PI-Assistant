[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.dynamic]
version = {attr = "router_controller.__version__"}

[project]
name = "router-pi-controller"
dynamic = ["version"]
description = "Raspberry Pi controller for Router devices"
requires-python = ">=3.11"
dependencies = [
	"flask>=3.0,<4.0",
	"paramiko>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
router_controller = "router_controller.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
router_controller = [
    "ui/templates/*.html",
	"ui/static/**/*",
]
