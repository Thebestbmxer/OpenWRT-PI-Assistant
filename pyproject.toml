[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.dynamic]
version = {attr = "openwrt_controller.__version__"}

[project]
name = "openwrt-pi-controller"
dynamic = ["version"]
description = "Raspberry Pi controller for OpenWrt devices"
requires-python = ">=3.11"
dependencies = [
	"flask>=3.0,<4.0",
	"paramiko>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
openwrt-controller = "openwrt_controller.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwrt_controller = [
    "ui/templates/*.html",
	"ui/static/**/*",
]
