<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Router Pi Controller
        {% endblock %}
    </title>

    <div class="ui-version">
        v{{ ui_version }}
    </div>

    <style>
        .ui-version {
            position: fixed;
            top: 10px;
            right: 14px;
            font-size: 12px;
            color: #888;
            z-index: 1000;
        }
    </style>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .welcome-page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        .welcome-header {
            margin-bottom: 32px;
        }

            .welcome-header h1 {
                margin: 0 0 12px;
                font-size: 32px;
            }

            .welcome-header p {
                margin: 0;
                color: #666;
                line-height: 1.6;
            }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

            .card-header h2 {
                margin: 0;
                font-size: 20px;
            }

        .card p {
            line-height: 1.5;
            color: #555;
        }

        .status-indicator {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            background: #e9ecef;
            color: #555;
        }

        .status-working {
            background: #fff3cd;
            color: #856404;
        }

        .status-success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-error {
            background: #f8d7da;
            color: #842029;
        }

        .information {
            margin-top: 20px;
            border-top: 1px solid #eee;
        }

        .information-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #666;
        }

        .value {
            font-weight: 600;
            text-align: right;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 6px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            background: #007bff;
            color: #fff;
            cursor: pointer;
        }

            button:hover:not(:disabled) {
                background: #0069d9;
            }

            button:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }

        @media (max-width: 600px) {

            .welcome-page {
                padding-top: 28px;
            }

            .card-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .information-row {
                flex-direction: column;
                gap: 4px;
            }

            .value {
                text-align: left;
            }
        }
    </style>

</head>

<body>

    {% block content %}
    {% endblock %}

</body>

</html>
